# 构建可分发成品并挂到 GitHub Release——不经过 npm 发布。
#
# 每个平台在原生 runner 上构建一次（闭包里的 native 依赖如 node-pty 是
# 平台相关的，跨平台构建会产出跑不起来的包），最后在一个 job 里合并
# SHA256SUMS 并创建 release。手动触发；tag 留空时用根 package.json 的版本。
name: Release bundle

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag; empty uses v<root package.json version>'
        required: false
        type: string

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  bundle:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-arm64
            runner: macos-latest
          - target: win-x64
            runner: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # `-js-` 变体：deploy-release.ts 经 npm_execpath 调 pnpm，需要它暴露
      # JS 入口（与 build-exe-for-python-sdk.yml 同一约定）。
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-js-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Configure pnpm store path
        id: pnpm-store
        shell: bash
        run: |
          store_root="$HOME/.local/share/pnpm/store"
          echo "PNPM_CONFIG_STORE_DIR=$store_root" >> "$GITHUB_ENV"
          store_path=$(PNPM_CONFIG_STORE_DIR="$store_root" pnpm store path --silent)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node-${{ env.PRIMARY_NODE_VERSION }}-pnpm-

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # 构建 + 部署闭包 + 补全依赖 + 启动校验 + 打包，全在 deploy-release.ts 里。
      - name: Build and bundle
        run: pnpm run deploy:release

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: |
            dist/release/*.tar.gz
            dist/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: bundle
    runs-on: ubuntu-latest
    # 唯一需要写权限的 job。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          path: dist/release

      - name: Collect artifacts and merge checksums
        run: |
          set -euo pipefail
          cd dist/release
          find . -mindepth 2 -name '*.tar.gz' -exec mv -f {} . \;
          find . -mindepth 2 -name 'SHA256SUMS' -exec cat {} \; | sort -k2 > SHA256SUMS
          find . -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
          ls -lh
          cat SHA256SUMS

      - name: Resolve tag
        id: tag
        run: |
          tag='${{ inputs.tag }}'
          if [ -z "$tag" ]; then
            tag="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "${{ steps.tag.outputs.tag }}" \
            --generate-notes \
            dist/release/*.tar.gz dist/release/SHA256SUMS
